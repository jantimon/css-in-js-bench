# Never add pull_request / pull_request_target triggers. This would be a security risk
name: benchmark

on:
  workflow_dispatch:
    inputs:
      tech:
        description: "Lane glob, e.g. next-yak* (empty = all). Filtered runs are never committed."
        required: false
        default: ""
      case:
        description: "Case glob (empty = all). Filtered runs are never committed."
        required: false
        default: ""
      commit:
        description: "Commit results to main (full runs on main only)"
        type: boolean
        default: true
  schedule:
    # Daily at 02:17 UTC while validating the setup.
    # Later switch to weekly (Mondays): "17 2 * * 1"
    - cron: "17 2 * * *"

# Only one benchmark job at a time. A running job is never cancelled;
# if several runs are waiting, GitHub keeps only the newest one.
concurrency:
  group: benchmark-machine
  cancel-in-progress: false

permissions:
  contents: write # push result/
  actions: write # trigger deploy.yml

jobs:
  # A scheduled run is skipped when main has no changes outside result/ since the last
  # committed benchmark. A manual run (workflow_dispatch) always benchmarks.
  changes:
    if: github.repository == 'jantimon/css-in-js-bench'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "Not a scheduled run"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git log -1 --format=%H --grep='^bench: update results' \
            --author='41898283+github-actions\[bot\]' HEAD)
          if [[ -z "$last" ]]; then
            echo "No earlier benchmark commit"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Compare against the commit the run measured, not the results commit.
          # Pushes during a run get rebased under the results commit but were not measured.
          base=$(git log -1 --format='%(trailers:key=Benchmarked-Commit,valueonly)' "$last" | head -n1)
          base=${base:-$last}
          echo "Last benchmark: $last (measured $base)"
          if git diff --quiet "$base" HEAD -- . ':(exclude)result/'; then
            echo "No changes outside result/ since the last benchmark, skip"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat "$base" HEAD -- . ':(exclude)result/'
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  bench:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: [self-hosted, linux, bench]
    timeout-minutes: 1320 # 22h
    env:
      TECH: ${{ inputs.tech }}
      CASE: ${{ inputs.case }}
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false # keep node_modules/ and vendor/wpd between runs

      - name: Reset workspace (keep caches)
        run: |
          git reset --hard
          git clean -ffdx -e node_modules/ -e vendor/

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
          pnpm setup:wpd
          # Screenshots are encoded with avifenc (libavif); the idle check needs mpstat (sysstat).
          command -v avifenc >/dev/null || { echo "::error::avifenc not on PATH (install libavif)"; exit 1; }
          command -v mpstat >/dev/null || { echo "::error::mpstat not on PATH (install sysstat)"; exit 1; }

      # Temporary: WPD's 4 GB Chrome trace buffer makes trace reads fail intermittently on this
      # Linux machine ("Protocol error (IO.read): Read failed" or a malformed trace). 2.2 GB was
      # tested reliable, so cap at 2 GB. Remove once WPD ships a fix.
      - name: Patch WPD trace buffer
        run: |
          f=vendor/wpd/node_modules/@jantimon/web-performance-debugger/dist/trace/tracing.js
          if grep -q 'TRACE_BUFFER_SIZE_KB = 2_000_000;' "$f"; then
            echo "already patched"
          elif grep -q 'TRACE_BUFFER_SIZE_KB = 4_000_000;' "$f"; then
            sed -i 's/TRACE_BUFFER_SIZE_KB = 4_000_000;/TRACE_BUFFER_SIZE_KB = 2_000_000;/' "$f"
            echo "patched"
          else
            echo "::error::WPD trace buffer setting changed ($(grep 'TRACE_BUFFER_SIZE_KB =' "$f")); check whether this patch is still needed"
            exit 1
          fi

      - name: Check machine is idle
        run: |
          sleep 30
          read -r idle steal < <(LC_ALL=C mpstat 1 10 | awk '/^Average/ && $2=="all" {print $NF, $(NF-3)}')
          echo "idle=${idle}% steal=${steal}%"
          if ! awk -v i="$idle" -v s="$steal" 'BEGIN { exit !(i >= 95 && s < 1) }'; then
            echo "::error::Machine not idle (idle=${idle}% steal=${steal}%)"
            exit 1
          fi
          { date -Is; uname -r; lsb_release -ds; node -v; pnpm -v; lscpu; } > machine-info.txt

      - name: Benchmark
        timeout-minutes: 1200 # 20h, leaves time for upload and commit
        run: |
          if [[ -z "$TECH" && -z "$CASE" ]]; then
            # The full report build: clean → samples → backfill → wpd → verify → report.
            pnpm build --fresh
          else
            # A filtered run measures only the matching cells in both stages and is not
            # reportable (the WPD manifest stays incomplete), so it is never committed.
            args=()
            [[ -n "$TECH" ]] && args+=(--tech "$TECH")
            [[ -n "$CASE" ]] && args+=(--case "$CASE")
            SKIP_VERIFY=1 pnpm gen:samples "${args[@]}"
            pnpm gen:wpd "${args[@]}"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.run_id }}
          path: |
            result/
            machine-info.txt
            .build/
            BENCHMARK.html
            BENCHMARK.md
            BENCHMARK.json
          if-no-files-found: ignore

      - name: Commit results and redeploy
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          inputs.tech == '' && inputs.case == '' &&
          (github.event_name != 'workflow_dispatch' || inputs.commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add result/
          if git diff --cached --quiet; then
            echo "No result changes"; exit 0
          fi
          git commit -m "bench: update results (${{ github.event_name }}, run ${{ github.run_id }})" \
            -m "Benchmarked-Commit: ${{ github.sha }}"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref main
