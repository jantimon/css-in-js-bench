# Builds the report from the committed raw samples in result/ and deploys it to
# GitHub Pages. Measurements are NOT run here — CI runners are noisy shared machines;
# numbers are produced by `pnpm gen` on a controlled machine and committed to result/.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Clone (not build) the vendored next-yak so the lanes' link: deps resolve;
      # the report only reads result/ + techs/ sources, it never imports next-yak.
      - run: node scripts/setup-next-yak.mjs --skip-build
      - run: pnpm install --frozen-lockfile
      - run: pnpm report
      - name: Stage site
        run: |
          mkdir -p _site
          cp BENCHMARK.html _site/index.html
          cp BENCHMARK.html BENCHMARK.md _site/
          [ -f BENCHMARK.zip ] && cp BENCHMARK.zip _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
