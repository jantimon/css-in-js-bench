# Workspace config for the benchmark suite. Each lane under techs/ is a real package
# with its own declared deps, so the comparison is isolated by construction — a
# styled-components lane physically cannot import goober.
#
# The one external seam is `next-yak`. The `next-yak` / `next-yak-css` lanes pin the
# published 9.6.0 baseline. The perf / folding / perf-folding pairs resolve immutable local
# package snapshots (matching JS + SWC wasm) created by `pnpm setup:yak-snapshots`; run it
# with NEXT_YAK_WORKTREE set to a clean next-yak checkout BEFORE `pnpm install`.
packages:
  - techs/*

# Native/postinstall build scripts that are allowed to run (pnpm 11 requires
# explicit approval; matches the root workspace config).
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true

# Disable pnpm 11's "minimum release age" gate (matches the root workspace config) —
# it would block freshly published next-yak versions and churn an exclude list here.
minimumReleaseAge: 0

# Shared dev deps the lanes reference as `catalog:dev`. Library-specific deps
# (styled-components, @emotion/*, goober, @stylexjs/stylex, @pandacss/dev,
# tailwind-merge, cnfast) are pinned per-lane in each tech's package.json so each
# lane owns its own versions explicitly.
catalogs:
  dev:
    react: ^19.2.5
    react-dom: ^19.2.5
    styled-components: ^6.4.1
    "@pandacss/dev": 2.0.0-beta.8
